name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    name: SDK and packed consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            samples/typescript/package-lock.json
      - run: npm ci --prefix sdk/typescript
      - run: npm run typecheck --prefix sdk/typescript
      - run: npm test --prefix sdk/typescript
      # Packs SDK, compiles an external consumer with both skipLibCheck values,
      # installs that exact local tarball into the sample, typechecks and imports it.
      # No API credentials or paid/provider calls.
      - run: npm run check:package --prefix sdk/typescript
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 -m py_compile samples/python/quickstart.py
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 -m venv "${{ runner.temp }}/plugin-checks"
      - run: '"${{ runner.temp }}/plugin-checks/bin/python" -m pip install -r scripts/requirements-plugin-checks.txt'
      # Components version independently; keep install IDs, MCP config and aliases compatible.
      # Cursor schemas are pinned to an official upstream commit. No service/paid calls.
      - run: '"${{ runner.temp }}/plugin-checks/bin/python" scripts/check-plugins.py'
